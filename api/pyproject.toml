[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pacifyco-api"
version = "0.1.0"
description = "Pacify babysitter marketplace API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.20",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16",
    "psycopg[binary]>=3.3,<4",
    "sentry-sdk[fastapi]>=2.73,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx2>=2.16",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
