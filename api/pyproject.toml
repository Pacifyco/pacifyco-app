[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pacifyco-api"
version = "0.1.0"
description = "Pacify babysitter marketplace API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.20",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16",
    "psycopg[binary]>=3.3,<4",
    "sentry-sdk[fastapi]>=2.73,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx2>=2.16",
    "ruff>=0.17,<0.18",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"
# Generated migrations are kept as reviewed, not reformatted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# api/alembic is the migrations folder, not the alembic package.
known-third-party = ["alembic"]
